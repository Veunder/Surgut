<head>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #07111f;
  --bg2: #102236;
  --panel: #16314C;
  --panel2: #27415A;
  --gold: #B8860B;
  --gold-light: #f0cf6a;
  --text: #eef6ff;
  --muted: #9cb3c9;
}

body {
  background: radial-gradient(circle at 30% 10%, #16314C 0%, #07111f 80%);
  font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

/* Снегопад фоновый */
.snow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}
.flake {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  filter: blur(0.5px);
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh) translateX(20px); }
}

header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 45px 20px 25px;
}
header h1 {
  font-size: clamp(2.5rem, 7vw, 5rem);
  letter-spacing: 6px;
  background: linear-gradient(135deg, #fff, #9fdcff, #f0cf6a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
header p {
  margin-top: 8px;
  font-size: 1rem;
  color: var(--muted);
}

.container {
  width: min(1400px, 92%);
  margin: auto;
  padding-bottom: 60px;
  position: relative;
  z-index: 8;
}

/* Карусель */
.slider {
  background: linear-gradient(145deg, #16314C, #0a1727);
  border-radius: 48px;
  overflow: hidden;
  box-shadow: 0 30px 50px rgba(0,0,0,0.5);
  position: relative;
  scroll-margin-top: 30px;
}

.content {
  display: flex;
  gap: 35px;
  padding: 35px;
  flex-wrap: wrap;
}

/* Блок с фото */
.image-carousel {
  flex: 1.1;
  min-width: 280px;
  position: relative;
  overflow: hidden;
  border-radius: 32px;
}
.image-box {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: 600px;
  border-radius: 32px;
  overflow: hidden;
  border: 1px solid rgba(245, 215, 66, 0.3);
  background: #0a1a2a;
}
.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.88) contrast(1.05);
  transition: all 0.45s ease;
  display: block;
}
/* Анимации для картинки */
.image-box img.slide-out-left {
  opacity: 0;
  transform: translateX(-80px) scale(0.95);
}
.image-box img.slide-out-right {
  opacity: 0;
  transform: translateX(80px) scale(0.95);
}
.image-box img.slide-in {
  animation: imageSlideIn 0.55s ease forwards;
}
@keyframes imageSlideIn {
  from {
    opacity: 0;
    transform: translateX(60px) scale(1.05);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 15%, transparent 55%);
  pointer-events: none;
}
.person-info {
  position: absolute;
  left: 25px;
  bottom: 30px;
  z-index: 5;
}
.person-info h2 {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  background: linear-gradient(135deg, white, #ffe7a3);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.person-info p { font-size: 1rem; color: #d9eaff; margin-top: 4px; }

/* Текстовый блок */
.text-block {
  flex: 1.2;
  min-width: 300px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.text-content {
  transition: all 0.4s ease;
}
.text-content h3 {
  font-size: 2rem;
  color: var(--gold-light);
  margin-bottom: 18px;
  border-left: 4px solid var(--gold-light);
  padding-left: 20px;
}
.bio-text {
  font-size: 1.05rem;
  line-height: 1.6;
  color: #ecf6ff;
  margin-bottom: 20px;
  text-align: justify;
}
.detail-info {
  background: rgba(255,255,255,0.05);
  border-radius: 24px;
  padding: 18px;
  margin: 20px 0;
  border-left: 3px solid var(--gold-light);
}
.detail-info p {
  font-size: 0.98rem;
  line-height: 1.5;
  color: #cde3f5;
  margin-bottom: 8px;
}
.detail-info strong {
  color: var(--gold-light);
}
/* Анимации текста */
.text-content.text-hide {
  opacity: 0;
  transform: translateY(20px);
}
.text-content.text-show {
  animation: textShow 0.5s ease forwards;
}
@keyframes textShow {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 20px;
}
.fact {
  background: linear-gradient(145deg, #27415A, #11283d);
  padding: 10px 8px;
  border-radius: 20px;
  text-align: center;
  font-size: 0.85rem;
  border: 1px solid rgba(255,255,255,0.06);
  transition: 0.2s;
}
.fact:hover { transform: translateY(-3px); border-color: var(--gold-light); }

/* Кнопки навигации */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  border-radius: 40px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(245,215,66,0.5);
  color: var(--gold-light);
  font-size: 32px;
  cursor: pointer;
  z-index: 30;
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.arrow:hover {
  background: rgba(0,0,0,0.85);
  color: white;
  transform: translateY(-50%) scale(1.05);
}
#prevBtn { left: 20px; }
#nextBtn { right: 20px; }

/* Снежный хлопок при клике */
.snow-pop {
  position: fixed;
  pointer-events: none;
  z-index: 2000;
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  filter: blur(1.5px);
  opacity: 0;
  animation: popFly 0.6s ease-out forwards;
  box-shadow: 0 0 6px rgba(255,255,200,0.8);
}
@keyframes popFly {
  0% { opacity: 0.9; transform: scale(0.2) translate(0, 0); }
  30% { opacity: 1; transform: scale(1.2) translate(var(--dx, -20px), var(--dy, -30px)); }
  100% { opacity: 0; transform: scale(0.5) translate(calc(var(--dx, -40px) * 1.8), calc(var(--dy, -60px) * 1.5)); }
}

/* ================= РЕКЛАМНЫЙ БЛОК (Aviasales) ================= */
.ad-banner {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 300px;
  background: linear-gradient(135deg, #1e2f4b, #0f1e32);
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 1px rgba(245,215,66,0.3);
  z-index: 1000;
  opacity: 0;
  transform: translateX(50px) scale(0.9);
  transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
  pointer-events: auto;
  backdrop-filter: blur(4px);
}
.ad-banner.show {
  opacity: 1;
  transform: translateX(0) scale(1);
}
.ad-banner a {
  text-decoration: none;
  display: flex;
  flex-direction: column;
  padding: 15px;
}
.ad-image {
  text-align: center;
  margin-bottom: 12px;
}
.ad-image img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 16px;
  transition: transform 0.3s;
}
.ad-banner:hover .ad-image img {
  transform: scale(1.05);
}
.ad-text {
  text-align: center;
}
.ad-title {
  font-size: 1.2rem;
  font-weight: bold;
  color: #ffd93d;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.ad-slogan {
  font-size: 0.85rem;
  color: #bcd0f0;
  line-height: 1.4;
}
.ad-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;

}
.ad-close:hover {

@media (max-width: 650px) {
  .ad-banner {

    font-size: 1rem;
  }
  .ad-slogan {
    font-size: 0.75rem;
  }
}
</style>

<script>
// --- Фоновый снег ---
function initSnow() {
  const snowDiv = document.getElementById('snowContainer');
  snowDiv.innerHTML = '';
  for (let i = 0; i < 130; i++) {
    const flake = document.createElement('div');
    flake.classList.add('flake');
    let size = Math.random() * 5 + 2;
    flake.style.width = size + 'px';
    flake.style.height = size + 'px';
    flake.style.left = Math.random() * 100 + '%';
    flake.style.opacity = Math.random() * 0.5 + 0.2;
    flake.style.animationDuration = Math.random() * 10 + 7 + 's';
    flake.style.animationDelay = Math.random() * -20 + 's';
    snowDiv.appendChild(flake);
  }
}
initSnow();

// --- Эффект снежного хлопка при клике ---
function createSnowPop(event, element) {
  const rect = element.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  for (let i = 0; i < 16; i++) {
    const pop = document.createElement('div');
    pop.classList.add('snow-pop');
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 40 + 20;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed - 15;
    pop.style.setProperty('--dx', dx + 'px');
    pop.style.setProperty('--dy', dy + 'px');
    pop.style.left = (centerX - 6) + 'px';
    pop.style.top = (centerY - 6) + 'px';
    pop.style.width = Math.random() * 14 + 6 + 'px';
    pop.style.height = pop.style.width;
    document.body.appendChild(pop);
    setTimeout(() => pop.remove(), 650);
  }
}

// --- ПОКАЗ РЕКЛАМЫ С ВЕРОЯТНОСТЬЮ 30% (при клике на стрелку) ---
let currentAdTimeout = null;

function tryShowAdOnClick() {
  // Если реклама уже видна, не показываем новую
  const adBlock = document.getElementById('aviasalesAd');
  if (adBlock.style.display === 'block' && adBlock.classList.contains('show')) {
    return;
  }
  
  const randomChance = Math.random() * 100;
  if (randomChance <= 30) {
    // Показываем рекламу
    adBlock.style.display = 'block';
    setTimeout(() => {
      adBlock.classList.add('show');
    }, 50);
    
    // Автоматически скрываем через 12 секунд
    if (currentAdTimeout) clearTimeout(currentAdTimeout);
    currentAdTimeout = setTimeout(() => {
      if (adBlock.classList.contains('show')) {
        closeAd();
      }
    }, 12000);
  }
}

// --- Закрытие рекламы ---
function closeAd() {
  const adBlock = document.getElementById('aviasalesAd');
  adBlock.classList.remove('show');
  setTimeout(() => {
    adBlock.style.display = 'none';
  }, 400);
  if (currentAdTimeout) clearTimeout(currentAdTimeout);
}

// --- КАРУСЕЛЬ С АНИМАЦИЕЙ ---
let currentIndex = 0;
let isTransitioning = false;

const imageEl = document.getElementById('personImage');
const nameEl = document.getElementById('personName');
const yearsEl = document.getElementById('personYears');
const textEl = document.getElementById('personText');
const extraInfoEl = document.getElementById('extraInfo');
const textContentBlock = document.getElementById('textContent');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderPerson(index, direction = 1) {
  const person = people[index];
  
  imageEl.classList.remove('slide-in', 'slide-out-left', 'slide-out-right');
  imageEl.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');
  
  textContentBlock.classList.remove('text-show');
  textContentBlock.classList.add('text-hide');
  
  setTimeout(() => {
    imageEl.src = person.image;
    nameEl.innerText = person.name;
    yearsEl.innerText = person.years;
    textEl.innerText = person.text;
    extraInfoEl.innerHTML = `<p>✨ <strong>Интересные факты:</strong> ${person.extra}</p>`;
    
    imageEl.classList.remove('slide-out-left', 'slide-out-right');
    imageEl.classList.add('slide-in');
    
    textContentBlock.classList.remove('text-hide');
    textContentBlock.classList.add('text-show');
    
    setTimeout(() => {
      textContentBlock.classList.remove('text-show');
    }, 500);
  }, 280);
}

function switchSlide(direction) {
  if (isTransitioning) return;
  isTransitioning = true;
  
  // Снежный хлопок на кнопке
  createSnowPop(null, direction === -1 ? prevBtn : nextBtn);
  
  // Пытаемся показать рекламу с вероятностью 30%
  tryShowAdOnClick();
  
  let newIndex = currentIndex + direction;
  if (newIndex >= people.length) newIndex = 0;
  if (newIndex < 0) newIndex = people.length - 1;
  currentIndex = newIndex;
  
  renderPerson(currentIndex, direction);
  
  document.querySelector('.slider').scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
  
  setTimeout(() => {
    isTransitioning = false;
  }, 700);
}

prevBtn.addEventListener('click', () => switchSlide(-1));
nextBtn.addEventListener('click', () => switchSlide(1));

// --- ЗАПУСК ---
renderPerson(0, 1);

// Предзагрузка всех изображений
people.forEach(p => { const img = new Image(); img.src = p.image; });

// Закрытие рекламы по крестику
document.getElementById('closeAdBtn').addEventListener('click', closeAd);
</script>
