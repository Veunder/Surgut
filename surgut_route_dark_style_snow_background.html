<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Сургут | Маршруты от вашей геопозиции</title>

<script src="https://api-maps.yandex.ru/2.1/?apikey=90c8e21a-aafb-44a8-a40f-a4188e5fe6c0&lang=ru_RU" type="text/javascript">
function createSnow(){

    const snow = document.getElementById('snow');

    for(let i = 0; i < 80; i++){

        const flake = document.createElement('div');

        flake.className = 'flake';
        flake.innerHTML = '❄';

        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.fontSize = (Math.random() * 18 + 10) + 'px';
        flake.style.animationDuration = (Math.random() * 8 + 5) + 's';
        flake.style.opacity = Math.random();

        snow.appendChild(flake);
    }
}

createSnow();

</script>

<style>
:root{
    --bg:#0d1b2a;
    --bg2:#13283f;
    --gold:#f4c430;
    --gold-dark:#b8860b;
    --ice:#7fd4f0;
    --text:#eaf2f8;
    --muted:#9bb3c7;
    --panel:#16314c;
    --green:#2ecc71;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    position:relative;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);
    color:var(--text);
    min-height:100vh;
}

.app-header{
    position:relative;
    z-index:5;
    background:rgba(6,18,31,.9);
    border-bottom:2px solid var(--gold-dark);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    position:sticky;
    top:0;
    z-index:100;
}

.header-container{
    max-width:1400px;
    margin:auto;
    height:78px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    font-size:2rem;
    font-weight:800;
    letter-spacing:.05em;
    background:linear-gradient(180deg,#fff,var(--ice));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.logo span{
    color:var(--gold);
}

.menu-icon{
    background:#10263b;
    border:1px solid var(--gold-dark);
    color:var(--gold);
    border-radius:40px;
    padding:10px 18px;
    cursor:pointer;
    transition:.2s;
}

.menu-icon:hover{
    transform:translateY(-2px);
    box-shadow:0 0 16px rgba(244,196,48,.3);
}

.nav-arrows{
    display:flex;
    gap:12px;
}

.arrow-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:linear-gradient(180deg,#ffe27a,var(--gold));
    color:#3a2a00;
    font-weight:800;
    cursor:pointer;
    transition:.15s;
}

.arrow-btn:hover{
    transform:scale(1.08);
}

.main-content{
    position:relative;
    z-index:5;
    max-width:1400px;
    margin:auto;
    padding:30px 20px;
}

.route-card{
    background:linear-gradient(160deg,#1c3a5a,#0e2236);
    border:2px solid var(--gold-dark);
    border-radius:28px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.route-header{
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.route-header h3{
    color:var(--ice);
    font-size:1.4rem;
}

.geo-btn,
.build-route-btn{
    border:none;
    border-radius:50px;
    padding:14px 26px;
    font-weight:800;
    cursor:pointer;
    transition:.15s;
    text-transform:uppercase;
}

.geo-btn{
    background:linear-gradient(180deg,#3be38a,var(--green));
    color:#05210f;
}

.build-route-btn{
    background:linear-gradient(180deg,#ffe27a,var(--gold));
    color:#3a2a00;
}

.geo-btn:hover,
.build-route-btn:hover{
    transform:translateY(-2px);
}

.input-group{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:24px;
}

.input-field{
    flex:1;
    min-width:220px;
}

.input-field label{
    display:block;
    margin-bottom:8px;
    color:var(--gold);
    font-size:.85rem;
    font-weight:700;
}

.input-field input{
    width:100%;
    background:#06121f;
    border:2px solid #24486c;
    color:var(--text);
    border-radius:18px;
    padding:14px 18px;
    font-size:1rem;
}

.input-field input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 20px rgba(244,196,48,.2);
}

.map-container{
    height:520px;
    border-radius:24px;
    overflow:hidden;
    border:2px solid var(--gold-dark);
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    background:#06121f;
}

#yandexMap{
    width:100%;
    height:100%;
}

.route-info{
    margin-top:20px;
    background:#10263b;
    border:1px solid #24486c;
    border-left:4px solid var(--gold);
    border-radius:18px;
    padding:18px;
    color:var(--text);
}

.route-info p{
    margin:8px 0;
    line-height:1.5;
}

.tiny-text{
    color:var(--muted);
    font-size:.85rem;
}

footer{
    position:relative;
    z-index:5;
    text-align:center;
    padding:30px 20px;
    color:var(--muted);
    font-size:.85rem;
}

@media(max-width:768px){

    .header-container{
        height:auto;
        padding:16px;
        flex-wrap:wrap;
        gap:12px;
    }

    .input-group{
        flex-direction:column;
    }

    .map-container{
        height:380px;
    }

    .logo{
        font-size:1.5rem;
    }
}

.snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.flake{
    position:absolute;
    top:-10px;
    color:white;
    opacity:.8;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(105vh) rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="snow" id="snow"></div>


<header class="app-header">
    <div class="header-container">
        <div class="logo-area">
            <div class="menu-icon" id="menuTrigger">☰ меню</div>
            <div class="logo">СУРГУТ<span>✦</span>ТУР</div>
        </div>

        <div class="nav-arrows">
            <button class="arrow-btn" id="backArrowBtn">←</button>
            <button class="arrow-btn" id="forwardArrowBtn">→</button>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="route-card">

        <div class="route-header">
            <h3>📍 Яндекс Карта · Маршрут по Сургуту</h3>

            <button class="geo-btn" id="geoRouteBtn">
                📍 Маршрут от меня до Сургута
            </button>
        </div>

        <div class="input-group">

            <div class="input-field">
                <label>🚩 Откуда</label>
                <input type="text" id="startPoint" value="Сургут, улица Ленина 1">
            </div>

            <div class="input-field">
                <label>🏁 Куда</label>
                <input type="text" id="endPoint" value="Сургут, ТРЦ «Сургут Сити Молл»">
            </div>

            <button class="build-route-btn" id="buildRouteBtn">
                🚀 Построить маршрут
            </button>

        </div>

        <div class="map-container">
            <div id="yandexMap"></div>
        </div>

        <div id="routeDetails" class="route-info">
            <p>📋 Нажмите «Построить маршрут» или «Маршрут от меня до Сургута».</p>
        </div>

    </div>
</main>

<footer>
    Сургут — культурная столица Севера | Маршруты на Яндекс.Картах
</footer>

<script>
let mapInstance = null;
let currentRouteCollection = null;

const startInput = document.getElementById('startPoint');
const endInput = document.getElementById('endPoint');
const buildBtn = document.getElementById('buildRouteBtn');
const geoRouteBtn = document.getElementById('geoRouteBtn');
const routeDetailsDiv = document.getElementById('routeDetails');

const SURGUT_COORDS = [61.254, 73.396];
const SURGUT_ADDRESS = "Сургут, центр города";

function initMap() {

    ymaps.ready(() => {

        mapInstance = new ymaps.Map("yandexMap", {
            center: [61.254, 73.396],
            zoom: 12,
            controls: ['zoomControl', 'fullscreenControl']
        });

        const surgutPlacemark = new ymaps.Placemark(
            SURGUT_COORDS,
            {
                balloonContent: "Сургут"
            },
            {
                preset: 'islands#redIcon'
            }
        );

        mapInstance.geoObjects.add(surgutPlacemark);

        buildRouteFromInputs();
    });
}

function buildRouteFromInputs(){

    const startAddr = startInput.value.trim();
    const endAddr = endInput.value.trim();

    if(currentRouteCollection){
        mapInstance.geoObjects.remove(currentRouteCollection);
    }

    const multiRoute = new ymaps.multirouter.MultiRoute({
        referencePoints:[startAddr,endAddr],
        params:{
            routingMode:'auto'
        }
    },{
        boundsAutoApply:true,
        routeStrokeColor:"#f4c430",
        routeStrokeWidth:5
    });

    multiRoute.model.events.add("requestsuccess", function(){

        const routes = multiRoute.getRoutes();

        if(routes && routes.length > 0){

            const activeRoute = routes[0];

            const distance = activeRoute.properties.get("distance").text;
            const duration = activeRoute.properties.get("duration").text;

            routeDetailsDiv.innerHTML = `
                <p>✅ Маршрут построен</p>
                <p>🚗 ${distance}</p>
                <p>⏱️ ${duration}</p>
                <p>📍 ${startAddr} → ${endAddr}</p>
            `;
        }
    });

    mapInstance.geoObjects.add(multiRoute);
    currentRouteCollection = multiRoute;
}

function buildRouteFromUserLocation(){

    navigator.geolocation.getCurrentPosition((position)=>{

        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        const multiRoute = new ymaps.multirouter.MultiRoute({
            referencePoints:[
                [latitude, longitude],
                SURGUT_COORDS
            ],
            params:{
                routingMode:'auto'
            }
        },{
            boundsAutoApply:true,
            routeStrokeColor:"#2ecc71",
            routeStrokeWidth:5
        });

        if(currentRouteCollection){
            mapInstance.geoObjects.remove(currentRouteCollection);
        }

        mapInstance.geoObjects.add(multiRoute);
        currentRouteCollection = multiRoute;

        routeDetailsDiv.innerHTML = `
            <p>📍 Геопозиция получена</p>
            <p>🛣️ Маршрут до Сургута построен</p>
        `;

    }, ()=>{

        routeDetailsDiv.innerHTML = `
            <p>❌ Не удалось получить геопозицию</p>
        `;
    });
}

buildBtn.addEventListener('click', buildRouteFromInputs);
geoRouteBtn.addEventListener('click', buildRouteFromUserLocation);

window.onload = function(){ initMap(); createSnow(); };

function createSnow(){

    const snow = document.getElementById('snow');

    for(let i = 0; i < 80; i++){

        const flake = document.createElement('div');

        flake.className = 'flake';
        flake.innerHTML = '❄';

        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.fontSize = (Math.random() * 18 + 10) + 'px';
        flake.style.animationDuration = (Math.random() * 8 + 5) + 's';
        flake.style.opacity = Math.random();

        snow.appendChild(flake);
    }
}

createSnow();

</script>

</body>
</html>
